<div class="skills-header">
  <h1>Skills</h1>
  <button (click)="addSkill()" class="icon-btn add-btn" title="Aggiungi skill">
    <i class="material-icons">add_circle_outline</i>
  </button>
</div>
@if (skills()) {
  <ul>
    @for (skill of skills(); track skill) {
      <li>
        <span>
          {{ skill.name }}
        </span>
        <button (click)="removeSkill(skill)" class="icon-btn" title="Rimuovi skill">
          <i class="material-icons">remove_circle_outline</i>
        </button>
      </li>
    }
  </ul>
}
@if (showAddSkillPopup) {
  <app-skill-popup
    [userSkills]="userSkills"
    (confirm) ="onSkillPopupConfirm($event)"
    (cancel)="onSkillPopupCancel()">
  </app-skill-popup>
}
