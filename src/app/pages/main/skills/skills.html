<header>
  <h2>{{ 'SKILLS.TITLE' | translate }}</h2>
  <button type="button" data-role="add" [attr.aria-label]="'SKILLS.ADD' | translate" [title]="'SKILLS.ADD' | translate" (click)="openDialog()">
    <i aria-hidden="true">add</i>
  </button>
</header>
<ul>
  @for (skill of items(); track skill.id) {
    <li>
      <span>{{ skill.name }}</span>
      <button type="button" [attr.aria-label]="'SKILLS.REMOVE' | translate" [title]="'SKILLS.REMOVE' | translate" (click)="remove(skill)">
        <i aria-hidden="true">close</i>
      </button>
    </li>
  }
</ul>
@if (dialogOpen()) {
  <app-skill-dialog [skills]="items()" (confirmed)="save($event)" (cancelled)="closeDialog()" />
}
