<dialog #dialog role="alertdialog" aria-labelledby="confirm-dialog-title" aria-describedby="confirm-dialog-message" (close)="cancel()">
  <h2 id="confirm-dialog-title">{{ title() }}</h2>
  <p id="confirm-dialog-message">{{ message() }}</p>
  <footer>
    <button type="button" autofocus (click)="cancel()">{{ 'COMMON.CANCEL' | translate }}</button>
    <button type="button" data-role="confirm" (click)="confirm()">{{ confirmLabel() }}</button>
  </footer>
</dialog>
